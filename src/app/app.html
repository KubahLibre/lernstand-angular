<header>
  <h1>Lernstand</h1>
  <p>Browser &rarr; FastAPI &rarr; PostgreSQL — jetzt mit Angular</p>
</header>

<main>
  @for (thema of themen; track thema.id) {
    <article>
      <h2>{{ thema.titel }}</h2>
      <p>Status: {{ thema.status }} | Kategorie: {{ kategorieName(thema.kategorie_id) }}</p>
      @if (thema.notiz) {
        <p>Notiz: {{ thema.notiz }}</p>
      }
    </article>
  } @empty {
    <p>Noch keine Themen geladen …</p>
  }
</main>
